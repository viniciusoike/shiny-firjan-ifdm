meta:
  name: EKIO
  link: https://github.com/viniciusoike/shiny-painel-mercado

color:
  palette:
    ekio-blue: "#1E3A5F"
    ekio-blue-dark: "#0D1B2A"
    ekio-blue-light: "#5597CC"
    ekio-teal: "#006261"
    ekio-orange: "#D3742A"
    ekio-amber: "#D5AA48"
    ekio-green: "#448255"
    ekio-red: "#B44D47"
    ekio-gray: "#6E7378"
    ekio-stone: "#B4B0AB"
    bluedark: ekio-blue-dark
    blue: ekio-blue
    teal: ekio-teal
    orange: ekio-orange
    green: ekio-green
    red: ekio-red
  foreground: "#191A1C"
  background: "#F5F3F1"
  primary: ekio-blue
  secondary: ekio-teal
  success: ekio-green
  info: ekio-blue-light
  warning: ekio-amber
  danger: ekio-red

typography:
  fonts:
    - family: Avenir
      source: system
  base:
    family: Avenir
    size: 14px
    line-height: 1.5
  headings:
    family: Avenir
    weight: 700

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04

    env:
      RENV_PATHS_ROOT: ~/.local/share/renv

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      # System libraries for sf, terra, units and lwgeom. Installed with apt
      # rather than an action: setup-r-dependencies is pak/DESCRIPTION based and
      # this project pins with renv instead.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev libsqlite3-dev

      - name: Add R-universe repo for ekioplot
        run: |
          cat >> .Rprofile << 'EOF'
          options(repos = c(
            viniciusoike = "https://viniciusoike.r-universe.dev",
            getOption("repos")
          ))
          EOF

      - name: Restore packages
        uses: r-lib/actions/setup-renv@v2

      - name: Validate R syntax
        run: |
          Rscript -e '
            files <- c("app.R", list.files("R", pattern = "[.]R$", full.names = TRUE))
            for (f in files) {
              message("Parsing ", f)
              invisible(parse(file = f))
            }
          '

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    environment: production

    env:
      RENV_PATHS_ROOT: ~/.local/share/renv

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      # System libraries for sf, terra, units and lwgeom. Installed with apt
      # rather than an action: setup-r-dependencies is pak/DESCRIPTION based and
      # this project pins with renv instead.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev libsqlite3-dev

      - name: Add R-universe repo
        run: |
          cat >> .Rprofile << 'EOF'
          options(repos = c(
            viniciusoike = "https://viniciusoike.r-universe.dev",
            getOption("repos")
          ))
          EOF

      - name: Restore packages
        uses: r-lib/actions/setup-renv@v2

      - name: Update manifest
        run: Rscript -e 'rsconnect::writeManifest()'

      - name: Deploy to Posit Connect
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
        run: |
          Rscript -e '
            rsconnect::addConnectAccount(
              url    = Sys.getenv("CONNECT_SERVER"),
              api_key = Sys.getenv("CONNECT_API_KEY")
            )
            rsconnect::deployApp(
              appName   = "shiny-firjan-ifdm",
              server    = Sys.getenv("CONNECT_SERVER"),
              forceUpdate = TRUE
            )
          '
